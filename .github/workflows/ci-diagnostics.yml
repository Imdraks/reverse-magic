name: Summarize CI test diagnostics
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Job in this repository whose last log lines should be summarized
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  summarize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      JOB_ID: ${{ inputs.job_id }}
    steps:
      - name: Report the last test log lines as a check annotation
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          job=os.environ['JOB_ID']
          assert re.fullmatch(r'[0-9]+',job)
          result=subprocess.run(['gh','api',f'repos/{os.environ["GH_REPO"]}/actions/jobs/{job}/logs'],capture_output=True,text=True)
          if result.returncode:
              error=re.sub(r'https?://[^\s]+','[URL withheld]',result.stderr)[-1500:]
              error=error.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::warning title=Log retrieval failure::'+error)
              raise SystemExit('The job log could not be retrieved; redirect details withheld.')
          message='\n'.join(result.stdout.splitlines()[-90:])
          message=message.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::warning title=CI test diagnostic::'+message)
          PY
