name: Publish Lantern Bridge for Windows and Linux

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release version tag
        required: true
        default: v0.7.1
        type: string

permissions:
  contents: write
  actions: read

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Test Linux transport and encrypted HomeKit on native architecture
        run: |
          set -o pipefail
          {
            python -m venv .venv
            .venv/bin/pip install -r linux/requirements.txt
            npm ci --prefix homekit --ignore-scripts --no-audit --no-fund
            PYTHONPATH=linux .venv/bin/python -m unittest discover -s linux/tests -v
            npm test --prefix homekit
          } 2>&1 | tee /tmp/lantern-tests.log
      - name: Summarize failed test output in check annotations
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path=Path('/tmp/lantern-tests.log')
          if path.exists():
              text='\n'.join(path.read_text().splitlines()[-90:])
              text=re.sub(r'\b\d{3}-\d{2}-\d{3}\b','[redacted pairing code]',text)
              text=text[-3200:]
              text=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::warning title=Linux test failure::'+text)
          PY
      - name: Build portable Linux bundle with verified Node runtime
        run: python scripts/package-linux.py --arch ${{ matrix.arch }} --output release/LanternDirect-Linux-${{ matrix.arch }}.tar.gz
      - name: Install and check the packaged command line
        run: |
          mkdir smoke
          tar -xzf release/LanternDirect-Linux-${{ matrix.arch }}.tar.gz -C smoke
          cd smoke/LanternDirect-Linux-${{ matrix.arch }}
          ./install.sh
          ./lantern --help
          ./lantern gateway adapters
          ./lantern gateway init --config /tmp/lantern-bridge-ci.json
          ./lantern gateway check --config /tmp/lantern-bridge-ci.json
          ./lantern gateway-service --config /tmp/lantern-bridge-ci.json > /tmp/lantern-bridge.service
          systemd-analyze verify /tmp/lantern-bridge.service
          runtime/bin/node --version
          runtime/bin/node -e 'require("./homekit/node_modules/tuyapi");if(!require("./gateway/registry").adapters["lsc-tuya-light"])throw Error("LSC missing")'
          .venv/bin/python -c 'import bleak, dbus_fast'
          ./lantern service --device AA:BB:CC:DD:EE:FF > /tmp/lantern-direct.service
          systemd-analyze verify /tmp/lantern-direct.service
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: LanternDirect-Linux-${{ matrix.arch }}
          path: release/LanternDirect-Linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  interface:
    name: Desktop interface
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare the desktop browser checks
        run: |
          python -m venv .venv
          .venv/bin/pip install -r linux/requirements.txt
          npm ci --prefix homekit --ignore-scripts --no-audit --no-fund
          npm ci --prefix ui --ignore-scripts --no-audit --no-fund
          browser_path=$(command -v google-chrome || command -v chromium || true)
          if [[ -z "$browser_path" ]]; then
            node ui/node_modules/playwright-core/cli.js install --with-deps chromium
            browser_path=$(node -e 'process.stdout.write(require("./ui/node_modules/playwright-core").chromium.executablePath())')
          fi
          echo "LANTERN_CHROMIUM=$browser_path" >> "$GITHUB_ENV"
      - name: Check real UI actions and capture light and dark appearance
        run: |
          npm test --prefix ui
          mkdir -p build/interface
          cp ../outputs/interface/*.png build/interface/
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: LanternDirect-interface
          path: build/interface/*.png
          if-no-files-found: error
          retention-days: 14

  package:
    needs: [linux, interface]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.401'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'

      - name: Verify HomeKit pairing and controller behavior
        run: |
          node --version
          npm ci --prefix homekit --ignore-scripts --no-audit --no-fund
          npm test --prefix homekit

      - name: Verify Windows protocol
        run: dotnet run --project windows-tests/ProtocolChecks.csproj

      - name: Build Windows x64 standalone application
        run: dotnet publish windows/LanternDirect.csproj -c Release -r win-x64 -o release/windows -p:ContinuousIntegrationBuild=true

      - name: Package Windows HomeKit bridge with verified Node runtime
        run: python3 scripts/package-homekit.py --exe release/windows/LanternDirect.exe --output release/LanternDirect-Windows-HomeKit.zip

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: LanternDirect-Linux-*
          merge-multiple: true
          path: release

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: LanternDirect-interface
          path: release/interface

      - name: Build per-user Windows installer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nsis
          python3 scripts/package-installer.py --bundle release/LanternDirect-Windows-HomeKit.zip --output release/LanternDirect-Setup.exe

      - name: Package sources, installation guide and checksums
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cp release/windows/LanternDirect.exe release/LanternDirect.exe
          cp docs/GATEWAY.md release/GUIDE-PONT.md
          cp release/interface/lantern-light.png release/LanternDirect-interface-claire.png
          cp release/interface/lantern-dark.png release/LanternDirect-interface-sombre.png
          git archive --format=zip HEAD windows windows-tests homekit gateway ui installer scripts/package-installer.py scripts/package-homekit.py MAISON-WINDOWS.txt docs > release/LanternDirect-Windows-sources.zip
          git archive --format=zip HEAD lantern linux homekit gateway ui windows/effects.json scripts/package-linux.py docs > release/LanternDirect-Linux-sources.zip
          cd release
          sha256sum LanternDirect-Setup.exe LanternDirect-interface-claire.png LanternDirect-interface-sombre.png LanternDirect-Linux-arm64.tar.gz LanternDirect-Linux-x64.tar.gz LanternDirect-Linux-sources.zip LanternDirect-Windows-HomeKit.zip LanternDirect.exe LanternDirect-Windows-sources.zip GUIDE-PONT.md > SHA256SUMS.txt

      - name: Stage release files
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import shutil
          source=Path('release');target=source/'publish-files';target.mkdir()
          shutil.copy2(source/'SHA256SUMS.txt',target/'SHA256SUMS.txt')
          for line in (source/'SHA256SUMS.txt').read_text().splitlines():
              name=line.split(None,1)[1]
              if name!='LanternDirect-Setup.exe':shutil.copy2(source/name,target/name)
          PYTHON
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: LanternDirect-release-assets
          path: release/publish-files/*
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: LanternDirect-release-installer
          path: release/LanternDirect-Setup.exe
          retention-days: 7
          if-no-files-found: error

  installer-smoke:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: LanternDirect-release-installer
          path: installer-check
      - name: Install, launch and uninstall on Windows
        shell: pwsh
        run: ./installer/smoke.ps1 ./installer-check/LanternDirect-Setup.exe

  release:
    needs: [package, installer-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: LanternDirect-release-*
          merge-multiple: true
          path: release
      - name: Verify release integrity
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - name: Upload assets to draft and publish
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release/existing-release.json 2>/dev/null; then
            python3 - <<'PY'
          import json
          assert json.load(open('release/existing-release.json'))['isDraft'], 'Refusing to overwrite a published release'
          PY
          else
            gh release create "$RELEASE_TAG" --draft --prerelease --target "$GITHUB_SHA" \
              --title "Lantern Bridge $RELEASE_TAG — Reconnexion automatique" --notes-file .github/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" \
            release/LanternDirect-Setup.exe release/LanternDirect-interface-claire.png release/LanternDirect-interface-sombre.png \
            release/LanternDirect-Linux-arm64.tar.gz release/LanternDirect-Linux-x64.tar.gz release/LanternDirect-Linux-sources.zip \
            release/LanternDirect-Windows-HomeKit.zip release/LanternDirect.exe \
            release/LanternDirect-Windows-sources.zip \
            release/GUIDE-PONT.md release/SHA256SUMS.txt --clobber
          gh release view "$RELEASE_TAG" --json assets > release/assets.json
          python3 - <<'PY'
          import json
          expected = {'LanternDirect-Setup.exe', 'LanternDirect-interface-claire.png', 'LanternDirect-interface-sombre.png', 'LanternDirect-Linux-arm64.tar.gz', 'LanternDirect-Linux-x64.tar.gz', 'LanternDirect-Linux-sources.zip', 'LanternDirect-Windows-HomeKit.zip', 'LanternDirect.exe',
                      'LanternDirect-Windows-sources.zip',
                      'GUIDE-PONT.md', 'SHA256SUMS.txt'}
          assets = json.load(open('release/assets.json'))['assets']
          assert expected == {asset['name'] for asset in assets}
          assert all(asset['state'] == 'uploaded' and asset['size'] > 0 for asset in assets)
          PY
          gh release edit "$RELEASE_TAG" --draft=false --prerelease \
            --title "Lantern Bridge $RELEASE_TAG — Reconnexion automatique" --notes-file .github/release-notes.md
