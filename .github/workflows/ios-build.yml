name: Build Lantern Direct iOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          mkdir -p build/logs

      - name: Portable protocol tests
        working-directory: ios
        run: |
          set -o pipefail
          swift test 2>&1 | tee ../build/logs/protocol-tests.log

      - name: Build unsigned iPhone application
        run: |
          set -o pipefail
          xcodebuild -project ios/LanternDirect.xcodeproj -scheme LanternDirect \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build \
            2>&1 | tee build/logs/ios-device-build.log

      - name: Package unsigned IPA
        run: |
          mkdir -p build/package/Payload
          cp -R build/device/Build/Products/Release-iphoneos/LanternDirect.app build/package/Payload/
          cd build/package
          zip -qr ../../LanternDirect-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: LanternDirect-unsigned-IPA
          path: LanternDirect-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: iOS simulator tests
        timeout-minutes: 8
        run: |
          set -o pipefail
          xcrun simctl list devices available --json > build/simulators.json
          simulator_id=$(python3 - <<'PY'
          import json
          data = json.load(open('build/simulators.json'))
          candidates = [device for runtime, devices in data['devices'].items()
                        if 'iOS' in runtime for device in devices
                        if device.get('isAvailable') and 'iPhone' in device['name']]
          if not candidates:
              raise SystemExit('No iPhone simulator installed on this runner')
          print(candidates[0]['udid'])
          PY
          )
          xcodebuild -project ios/LanternDirect.xcodeproj -scheme LanternDirect \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO test \
            2>&1 | tee build/logs/ios-simulator-tests.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: LanternDirect-build-logs
          path: build/logs/
          if-no-files-found: ignore
          retention-days: 14
